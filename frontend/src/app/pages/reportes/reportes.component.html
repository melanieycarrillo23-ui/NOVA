<section class="reports-page">

  <button
    *ngIf="mostrarVolverInicio"
    type="button"
    class="back-link"
    (click)="volver()"
  >
    <span aria-hidden="true">←</span>
    Volver al inicio
  </button>

  <button
    *ngIf="mostrarVolverMisEventos"
    type="button"
    class="back-link"
    (click)="volver()"
  >
    <span aria-hidden="true">←</span>
    Volver a mis eventos
  </button>


  <header class="page-header">

    <div>

      <h1 class="page-title">
        Reportes
      </h1>

      <p class="page-subtitle">
        Consulta los indicadores de inscripción
        y asistencia de tus eventos.
      </p>

    </div>

  </header>
