services:
  db:
    image: postgres:17
    container_name: nova_db

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nova}
      POSTGRES_USER: ${POSTGRES_USER:-nova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nova_dev_password}

    ports:
      - "${POSTGRES_PORT:-5433}:5432"

    volumes:
      - nova_postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-nova} -d ${POSTGRES_DB:-nova}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20


  backend:
    build: ./backend
    container_name: nova_backend

    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-change-this-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}

      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}

      POSTGRES_DB: ${POSTGRES_DB:-nova}
      POSTGRES_USER: ${POSTGRES_USER:-nova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nova_dev_password}

      POSTGRES_HOST: db
      POSTGRES_PORT: 5432

      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@nova.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-NovaAdmin123!}

      CARGAR_DEMO: ${CARGAR_DEMO:-1}

    command: >
      sh -c "python manage.py crear_esquemas &&
             python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py preparar_base &&
             gunicorn nova_backend.wsgi:application --bind 0.0.0.0:8000 --workers 3"

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    depends_on:
      db:
        condition: service_healthy


  frontend:
    build: ./frontend
    container_name: nova_frontend

    ports:
      - "4200:80"

    depends_on:
      - backend


volumes:
  nova_postgres_data: